name: AI Code Review

# 使用 Google Gemini API 免费额度做代码审核
# 需在仓库 Settings → Secrets → Actions 中添加 GEMINI_API_KEY
# 获取密钥：https://aistudio.google.com/apikey （免费）

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: files
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD > changed.txt
          echo "count=$(wc -l < changed.txt)" >> $GITHUB_OUTPUT
          cat changed.txt

      - name: AI Review with Gemini
        if: steps.files.outputs.count > 0
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const fs = require('fs');
            const files = fs.readFileSync('changed.txt', 'utf8').trim().split('\n').filter(f =>
              /\.(js|html|css|md)$/.test(f) && !f.includes('node_modules') && !f.includes('lib/')
            );

            if (files.length === 0) {
              console.log('No reviewable files');
              return;
            }

            // 收集变更内容
            let diffContent = '';
            for (const file of files.slice(0, 10)) {
              try {
                const content = fs.readFileSync(file, 'utf8');
                diffContent += `\n### ${file}\n\`\`\`\n${content.slice(0, 3000)}\n\`\`\`\n`;
              } catch (e) {}
            }

            const prompt = `你是资深前端代码审核专家。请审核以下代码变更，从代码质量、性能、安全性、算法正确性、可维护性、用户体验6个维度给出具体改进建议。用中文回复，格式为Markdown。

项目背景：15分钟生活圈智能体检与规划助手，基于百度地图JS API GL的纯前端Web应用。

变更文件：
${diffContent}

请输出：
1. 严重问题（必须修复）
2. 改进建议（建议修复）
3. 优点（值得保持）`;

            // 调用 Gemini API
            const apiKey = process.env.GEMINI_API_KEY;
            if (!apiKey) {
              console.log('GEMINI_API_KEY not set, skipping review');
              return;
            }

            const response = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: prompt }] }],
                  generationConfig: { temperature: 0.3, maxOutputTokens: 4096 }
                })
              }
            );

            const data = await response.json();
            const review = data.candidates?.[0]?.content?.parts?.[0]?.text || '审核结果为空';

            // 发布到 PR 评论
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 AI Code Review\n\n${review}\n\n---\n_由 Gemini 2.0 Flash 自动审核_`
            });

      - name: Skip notice
        if: steps.files.outputs.count == 0
        run: echo "No changed files to review"