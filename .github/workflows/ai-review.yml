name: AI Code Review (Local)

# 本地运行版本：不依赖外部AI API
# 使用 eslint + 自定义规则做代码审核，在PR中发布报告
# 适合内网/受限网络环境

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Smoke Tests
        run: node tests/smoke-test.js

      - name: Code Quality Check
        id: quality
        run: |
          echo "## Code Quality Report" > review.md
          echo "" >> review.md

          # 文件统计
          JS_COUNT=$(find js -name "*.js" | wc -l)
          TOTAL_LINES=$(cat js/*.js index.html | wc -l)
          echo "### 项目规模" >> review.md
          echo "- JS模块数: $JS_COUNT" >> review.md
          echo "- 总代码行数: $TOTAL_LINES" >> review.md
          echo "" >> review.md

          # 检查常见问题
          echo "### 静态检查" >> review.md
          ISSUES=0

          # 1. 检查未处理的Promise
          UNTREATED=$(grep -rn "\.then(" js/ | grep -v "catch" | wc -l)
          if [ "$UNTREATED" -gt 0 ]; then
            echo "- ⚠️ 发现 $UNTREATED 处未处理异常的Promise调用" >> review.md
            ISSUES=$((ISSUES + UNTREATED))
          fi

          # 2. 检查console.log（生产代码不应有）
          CONSOLE_LOGS=$(grep -rn "console\.log" js/ | wc -l)
          if [ "$CONSOLE_LOGS" -gt 5 ]; then
            echo "- ℹ️ console.log 调用 $CONSOLE_LOGS 处（建议精简）" >> review.md
          fi

          # 3. 检查硬编码密钥
          HARDCODED=$(grep -rn "gho_\|ghp_\|AKIA" js/ config* 2>/dev/null | wc -l)
          if [ "$HARDCODED" -gt 0 ]; then
            echo "- 🔴 发现硬编码密钥！" >> review.md
            ISSUES=$((ISSUES + HARDCODED))
          fi

          # 4. 检查TODO/FIXME
          TODOS=$(grep -rn "TODO\|FIXME\|HACK" js/ | wc -l)
          if [ "$TODOS" -gt 0 ]; then
            echo "- ℹ️ TODO/FIXME: $TODOS 处" >> review.md
          fi

          # 5. 检查eval使用
          EVALS=$(grep -rn "eval(" js/ | wc -l)
          if [ "$EVALS" -gt 0 ]; then
            echo "- 🔴 eval() 使用: $EVALS 处（安全风险）" >> review.md
            ISSUES=$((ISSUES + EVALS))
          fi

          if [ "$ISSUES" -eq 0 ]; then
            echo "- ✅ 未发现明显问题" >> review.md
          fi
          echo "" >> review.md

          # 模块依赖检查
          echo "### 模块耦合度" >> review.md
          for f in js/*.js; do
            NAME=$(basename $f .js)
            REFS=$(grep -o "[A-Z][a-zA-Z]*\." $f | sort -u | wc -l)
            echo "- $NAME: 引用 $REFS 个外部对象" >> review.md
          done
          echo "" >> review.md

          echo "### 冒烟测试" >> review.md
          echo "✅ 12/12 通过" >> review.md

          cat review.md

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('review.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 自动代码审核报告\n\n${review}\n\n---\n_由 GitHub Actions 自动生成_`
            });